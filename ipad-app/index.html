<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مدرستي">
<meta name="theme-color" content="#BFE9FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; overscroll-behavior: none; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  .hub-link {
    position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 15;
    width: 56px; height: 56px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    font-size: 28px; text-decoration: none; box-shadow: 0 5px 0 rgba(34,48,74,.18);
  }
  .hub-link.left { right: auto; left: 14px; }   /* English page: the writing board sits on the right */
</style>
<title>مدرستي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, #BFE9FF 0%, #E6F7FF 70%, #FDF3D6 100%); color: #22304A;
    font-family: "Baloo Bhaijaan 2", "Segoe UI", Tahoma, Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .hub { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 28px; display: flex; flex-direction: column; gap: 20px; }
  h1 { margin: 0; text-align: center; font-size: clamp(48px, 10vw, 76px); line-height: 1.1; }
  .sub { margin: 0; text-align: center; font-size: 22px; color: #5B6780; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
  .card {
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: inherit;
    background: #fff; border-radius: 30px; padding: 24px 16px; box-shadow: 0 7px 0 rgba(34,48,74,.18);
  }
  .card:active { transform: translateY(4px); box-shadow: 0 3px 0 rgba(34,48,74,.18); }
  .card .em { font-size: 76px; line-height: 1.1; }
  .card b { font-size: 34px; }
  .card span { font-size: 19px; color: #5B6780; text-align: center; }
  .grade { font-size: 16px; font-weight: 800; border-radius: 999px; padding: 2px 14px; color: #fff; }
</style>
<main class="hub">
  <h1>مدرستي 🦉</h1>
  <p class="sub">اختر اللعبة</p>
  <div class="cards">
    <a class="card" href="letters.html">
      <span class="grade" style="background:#E8508A">KG1</span>
      <div class="em">✏️</div>
      <b>حروفي بالقلم</b>
      <span>أتعلم أكتب الحروف العربية بالقلم أو بإصبعي</span>
    </a>
    <a class="card" href="english.html">
      <span class="grade" style="background:#E8508A">KG1</span>
      <div class="em">🔤</div>
      <b>My ABC</b>
      <span>أتعلم الحروف الإنجليزية بالقلم: A إلى M</span>
    </a>
    <a class="card" href="grade2.html">
      <span class="grade" style="background:#2F80ED">الصف الثاني</span>
      <div class="em">🎮</div>
      <b>هذا وهذه وهؤلاء</b>
      <span>أسماء الإشارة بالصور والجمل</span>
    </a>
  </div>
</main>

<script>
  // offline support: cache the app the first time it opens
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</html>
