<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مدرستي">
<meta name="theme-color" content="#BFE9FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; overscroll-behavior: none; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  .hub-link {
    position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 15;
    width: 56px; height: 56px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    font-size: 28px; text-decoration: none; box-shadow: 0 5px 0 rgba(34,48,74,.18);
  }
  .hub-link.left { right: auto; left: 14px; }   /* English page: the writing board sits on the right */
</style>
<title>هذا وهذه وهؤلاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
  :root {
    color-scheme: light;
    --sky: #BFE9FF;
    --sky-deep: #7FD3F7;
    --paper: #FFFBF0;
    --ink: #22304A;
    --ink-soft: #5B6780;
    --sun: #FFC93C;
    --boy: #2F80ED;      /* هذا */
    --girl: #E8508A;     /* هذه */
    --crowd: #2BA84A;    /* هؤلاء */
    --wrong: #F2994A;
    --shadow: 0 6px 0 rgba(34,48,74,.18);
    --font: "Baloo Bhaijaan 2", "Segoe UI", Tahoma, Arial, sans-serif;
    --letter-font: "Noto Naskh Arabic", "Traditional Arabic", "Segoe UI", serif;  /* book-style text with tashkeel */
    --go: #2BA84A;
    --rule: #D6E7F5;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    background: linear-gradient(180deg, var(--sky) 0%, #E6F7FF 70%, #D8F3D0 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font);
    font-size: 18px;
  }
  .app {
    max-width: 760px; margin: 0 auto;
    padding-inline: 16px; padding-block: 16px 40px;
    min-height: 100%;
    display: flex; flex-direction: column; gap: 16px;
  }
  button { font-family: inherit; cursor: pointer; }
  /* touch screens: no text selection, long-press menu, grey tap flash or double-tap zoom */
  html { -webkit-text-size-adjust: 100%; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  input { -webkit-user-select: text; user-select: text; }
  button:focus-visible, input:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }

  /* top bar */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .icon-btn {
    border: 0; background: #fff; color: var(--ink);
    border-radius: 999px; padding: 8px 16px; font-size: 18px; font-weight: 700;
    box-shadow: var(--shadow); display: inline-flex; align-items: center; gap: 6px;
  }
  .icon-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(34,48,74,.18); }

  /* mascot + bubble */
  .guide { display: flex; align-items: flex-end; gap: 10px; }
  .owl { font-size: 64px; line-height: 1; filter: drop-shadow(0 4px 0 rgba(34,48,74,.15)); }
  .owl.bounce { animation: hop .6s ease; }
  .bubble {
    position: relative; background: #fff; border-radius: 22px; padding: 10px 18px;
    font-size: 22px; font-weight: 700; box-shadow: var(--shadow); flex: 1; min-height: 52px;
    display: flex; align-items: center;
  }
  .bubble::after {
    content: ""; position: absolute; bottom: 12px; right: -10px;
    border: 10px solid transparent; border-left-color: #fff; border-right: 0;
  }

  h1 {
    font-size: clamp(40px, 9vw, 64px); line-height: 1.1; margin: 0; text-align: center;
    text-wrap: balance; font-weight: 800;
  }
  h1 .w1 { color: var(--boy); } h1 .w2 { color: var(--girl); } h1 .w3 { color: var(--crowd); }
  .sub { text-align: center; color: var(--ink-soft); margin: 0; font-size: 20px; }

  .panel { background: var(--paper); border-radius: 28px; padding: 20px; box-shadow: var(--shadow); }

  /* start screen */
  .rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .rule { border-radius: 20px; padding: 14px 10px; text-align: center; color: #fff; }
  .rule b { display: block; font-size: 34px; line-height: 1.2; }
  .rule span { font-size: 16px; opacity: .95; }
  .rule .em { font-size: 34px; display: block; margin-top: 4px; }
  .c-boy { background: var(--boy); } .c-girl { background: var(--girl); } .c-crowd { background: var(--crowd); }
  .name-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
  .name-row label { font-weight: 700; font-size: 20px; }
  .name-row input {
    font-family: inherit; font-size: 22px; padding: 8px 16px; border-radius: 16px;
    border: 3px solid var(--sky-deep); width: 220px; max-width: 100%; text-align: center; background: #fff; color: var(--ink);
  }
  .big-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .big {
    border: 0; border-radius: 26px; padding: 18px 12px; font-size: 28px; font-weight: 800; color: var(--ink);
    box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: transform .1s;
  }
  .big small { font-size: 16px; font-weight: 500; color: var(--ink-soft); }
  .big .em { font-size: 44px; }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(34,48,74,.18); }
  .b-learn { background: #fff; }
  .b-play { background: var(--sun); }
  .voice-note { font-size: 15px; color: var(--ink-soft); text-align: center; margin: 0; }

  /* learn */
  .tabs { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .tab {
    border: 0; border-radius: 999px; padding: 8px 22px; font-size: 26px; font-weight: 800;
    background: #fff; color: var(--ink); box-shadow: var(--shadow);
  }
  .tab[aria-pressed="true"] { color: #fff; }
  .tab.c-boy[aria-pressed="true"] { background: var(--boy); }
  .tab.c-girl[aria-pressed="true"] { background: var(--girl); }
  .tab.c-crowd[aria-pressed="true"] { background: var(--crowd); }
  .tip { text-align: center; font-size: 20px; margin: 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card {
    border: 0; background: #fff; border-radius: 22px; padding: 12px 8px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink);
  }
  .card .pic { font-size: 50px; line-height: 1.2; letter-spacing: -6px; }
  .card .txt { font-size: 24px; font-weight: 700; }
  .card .txt .p { font-weight: 800; }
  .card.playing { animation: hop .5s ease; }

  /* quiz */
  .progress { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .dot { width: 26px; height: 26px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 15px; box-shadow: 0 3px 0 rgba(34,48,74,.15); }
  .dot.now { outline: 3px solid var(--sun); }
  .q-card { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .q-pic { font-size: clamp(80px, 22vw, 130px); line-height: 1.15; letter-spacing: -10px; }
  .q-sentence { font-size: clamp(34px, 8vw, 48px); font-weight: 800; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .blank {
    min-width: 120px; border-bottom: 5px dashed var(--ink-soft); padding-inline: 8px; color: var(--ink-soft);
  }
  .blank.filled { border-bottom-style: solid; }
  .hear { border: 0; background: var(--sky); border-radius: 999px; padding: 6px 16px; font-size: 18px; font-weight: 700; color: var(--ink); }
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .choice {
    border: 0; border-radius: 24px; padding: 16px 6px; font-size: clamp(30px, 7vw, 42px); font-weight: 800; color: #fff;
    box-shadow: var(--shadow); transition: transform .1s, opacity .2s;
  }
  .choice:active { transform: translateY(4px); }
  .choice:disabled { opacity: .35; cursor: default; }
  .choice.right { outline: 6px solid var(--sun); animation: hop .5s ease; opacity: 1; }
  .choice.no { animation: shake .4s ease; }
  .pick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
  .pick {
    border: 4px solid transparent; background: #fff; border-radius: 24px; padding: 12px 4px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink);
  }
  .pick .pic { font-size: clamp(44px, 12vw, 64px); line-height: 1.2; letter-spacing: -8px; }
  .pick .w { font-size: 22px; font-weight: 700; }
  .pick:disabled { opacity: .35; cursor: default; }
  .pick.right { border-color: var(--sun); opacity: 1; animation: hop .5s ease; }
  .pick.no { animation: shake .4s ease; }
  .ask { font-size: clamp(26px, 6vw, 34px); font-weight: 800; margin: 0; }
  .ask .p { padding: 0 10px; border-radius: 12px; color: #fff; }
  .next {
    border: 0; background: var(--sun); color: var(--ink); border-radius: 999px; padding: 12px 40px;
    font-size: 28px; font-weight: 800; box-shadow: var(--shadow); align-self: center;
  }
  .streak { text-align: center; font-size: 22px; font-weight: 800; color: var(--girl); min-height: 1.4em; margin: 0; }

  /* end */
  .end { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .trophy { font-size: 110px; line-height: 1; animation: hop 1.2s ease infinite; }
  .stars { font-size: 60px; letter-spacing: 6px; }
  .stars .off { filter: grayscale(1); opacity: .3; }
  .score { font-size: 30px; font-weight: 800; margin: 0; }

  /* levels & hard mode */
  .big-actions.three { grid-template-columns: repeat(3, 1fr); }
  .b-hard { background: #6C4DD8; color: #fff; }
  .b-hard small { color: #E4DCFF; }
  .level-tag { align-self: center; border-radius: 999px; padding: 4px 18px; font-weight: 800; font-size: 18px; background: var(--sun); color: var(--ink); }
  .level-tag.hard { background: #6C4DD8; color: #fff; }
  .group-title { grid-column: 1 / -1; font-size: 22px; font-weight: 800; color: var(--girl); border-bottom: 3px dashed #F4B6CD; padding-block: 6px 2px; }
  .choices { width: 100%; }
  .choices.two { grid-template-columns: 1fr 1fr; }
  .c-wrong { background: var(--wrong); }
  .ask.small { font-size: 22px; color: var(--ink-soft); }
  .q-pic.mystery { opacity: .5; letter-spacing: 0; }
  .fix { font-size: 26px; font-weight: 700; margin: 0; background: #FFF1C9; border-radius: 16px; padding: 6px 16px; }
  .pick-grid.four { grid-template-columns: repeat(2, 1fr); }

  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  @keyframes hop { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-14px) scale(1.06) } }
  @keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  /* tablets (iPad): bigger canvas, bigger targets */
  @media (min-width: 820px) {
    .app { max-width: 980px; }
    .cards { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
    .card .pic { font-size: 64px; }
    .card .txt { font-size: 28px; }
    .choice { padding-block: 22px; }
    .pick .pic { font-size: 76px; }
    .bubble { font-size: 26px; }
  }
  @media (max-width: 480px) {
    .rules { gap: 8px; } .rule b { font-size: 26px; } .rule span { font-size: 14px; }
    .big { font-size: 22px; } .big .em { font-size: 36px; }
    .owl { font-size: 50px; } .bubble { font-size: 19px; }
    .cards { grid-template-columns: repeat(2, 1fr); }
  }
  /* ---- منهج الصف الثاني ---- */
  .course-home h1 { font-size: clamp(36px, 7vw, 54px); }
  .unit-title { font-size: 24px; margin: 8px 0 0; color: var(--ink); }
  .course-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .lesson-card { display: flex; align-items: center; gap: 12px; border: 0; background: #fff; border-radius: 22px; padding: 10px 14px; box-shadow: var(--shadow); text-align: right; font-family: inherit; color: var(--ink); cursor: pointer; }
  .lesson-card.special { background: #FFF6D8; }
  .lesson-card.done { box-shadow: 0 0 0 3px var(--go), var(--shadow); }
  .lesson-card:active { transform: translateY(3px); }
  .lc-num { width: 34px; height: 34px; border-radius: 50%; background: var(--sky); display: grid; place-items: center; font-weight: 800; flex: none; }
  .lc-ch { font-size: 36px; min-width: 56px; text-align: center; }
  .lc-info { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .lc-info b { font-size: 21px; }
  .lc-info small { font-size: 15px; color: var(--ink-soft); }
  .lc-state { font-size: 22px; min-width: 26px; }
  .bar-prog { height: 8px; border-radius: 99px; background: #EEF1F6; overflow: hidden; }
  .bar-prog i { display: block; height: 100%; background: var(--go); border-radius: 99px; }
  .game-card { border: 0; border-radius: 22px; padding: 14px; font-size: 24px; font-weight: 800; background: var(--sun); box-shadow: var(--shadow); font-family: inherit; color: var(--ink); cursor: pointer; }
  .l-head { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .l-icon { font-size: 52px; }
  .l-title { font-size: 30px; font-weight: 800; text-align: center; }
  .steps { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .chip { border: 0; border-radius: 999px; padding: 4px 16px; font-weight: 800; font-size: 18px; background: #fff; color: var(--ink-soft); box-shadow: 0 3px 0 rgba(34,48,74,.12); font-family: inherit; cursor: pointer; }
  .chip.on { background: var(--sun); color: var(--ink); }
  .chip.done { background: var(--go); color: #fff; }
  .l-body { background: var(--paper); border-radius: 28px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
  .big-act { align-self: center; border: 0; border-radius: 999px; padding: 10px 30px; font-size: 24px; font-weight: 800; box-shadow: var(--shadow); background: #fff; font-family: inherit; color: var(--ink); cursor: pointer; }
  .big-act.go { background: var(--go); color: #fff; }
  .big-act.primary { background: var(--sun); }
  .q-sent, .q-word, .vrow, .poem-line, .rule-line, .ex-card, .opt, .tile-l { font-family: var(--letter-font); }
  .poem { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .poem-line { border: 0; background: #fff; border-radius: 16px; padding: 8px 12px; font-size: 26px; line-height: 1.8; box-shadow: 0 3px 0 rgba(34,48,74,.1); color: var(--ink); cursor: pointer; }
  .vt { margin: 4px 0 0; font-size: 22px; color: var(--girl); }
  .vlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
  .vrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 0; background: #fff; border-radius: 16px; padding: 6px 14px; font-size: 24px; line-height: 1.8; color: var(--ink); cursor: pointer; }
  .vrow i { font-style: normal; color: var(--ink-soft); font-family: var(--font); }
  .vrow span:last-child { color: var(--boy); }
  .rule-box { background: #FFF1C9; border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .rule-line { border: 0; background: transparent; text-align: right; font-size: 24px; line-height: 1.9; color: var(--ink); cursor: pointer; border-radius: 12px; padding: 2px 8px; }
  .rule-line:hover { background: rgba(255,255,255,.6); }
  .examples { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .ex-card { border: 0; background: #fff; border-radius: 18px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; font-size: 24px; line-height: 1.8; box-shadow: 0 3px 0 rgba(34,48,74,.1); color: var(--ink); text-align: right; cursor: pointer; }
  .ex-card .em { font-size: 34px; font-family: var(--font); }
  .cleared { text-align: center; font-size: 24px; font-weight: 700; }
  .cleared p { margin: 0; }
  .big-em { font-size: 84px; line-height: 1.1; }
  .qdots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .qdots span { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid var(--rule); }
  .qdots span.on { background: var(--go); border-color: var(--go); }
  .qdots span.now { background: var(--sun); border-color: var(--sun); }
  .q { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .q-head { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .q-pic { font-size: 80px; line-height: 1.1; }
  .q-word { font-size: 40px; line-height: 1.7; font-weight: 700; display: flex; align-items: center; gap: 4px; }
  .q-sent { font-size: 32px; line-height: 1.9; text-align: center; font-weight: 700; }
  .q-sent .gap { display: inline-block; min-width: 90px; border-bottom: 4px dashed var(--ink-soft); color: var(--ink-soft); text-align: center; }
  .q-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
  .q-opts.two { grid-template-columns: repeat(2, 1fr); }
  .q-opts.one { grid-template-columns: 1fr; }
  .q-opts.many { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .opt { border: 0; background: #fff; border-radius: 22px; padding: 10px 8px; box-shadow: var(--shadow); font-size: 30px; line-height: 1.6; min-height: 76px; font-weight: 700; color: var(--ink); cursor: pointer; }
  .opt.right, .opt.picked { box-shadow: 0 0 0 5px var(--go), var(--shadow); animation: hop .5s ease; }
  .opt.no { animation: shake .4s ease; }
  .opt:disabled { opacity: .4; cursor: default; }
  .opt.right:disabled, .opt.picked:disabled { opacity: 1; }
  .tile-l { min-width: 56px; height: 64px; padding-inline: 6px; border-radius: 14px; background: #fff; border: 3px dashed var(--wrong); color: var(--wrong); display: inline-grid; place-items: center; font-size: 34px; }
  @media (max-width: 520px) { .poem { grid-template-columns: 1fr; } .q-sent { font-size: 26px; } .opt { font-size: 24px; } }
</style>

<canvas id="fx"></canvas>
<div class="app" dir="rtl" lang="ar">
  <div class="bar">
    <button class="icon-btn" id="homeBtn" hidden>🏠 الرئيسية</button>
    <span></span>
    <button class="icon-btn" id="soundBtn" aria-pressed="true">🔊 الصوت</button>
  </div>

  <div class="guide">
    <div class="owl" id="owl" aria-hidden="true">🦉</div>
    <div class="bubble" id="bubble" aria-live="polite">أهلًا يا بطل! هيا نتعلم معًا</div>
  </div>

  <!-- COURSE HOME: منهج الصف الثاني -->
  <section id="scrCourse" class="course-home" style="display:flex;flex-direction:column;gap:14px">
    <h1>العربي <span class="w2">للصف الثاني</span></h1>
    <p class="sub">منهج الترم الأول بترتيب كتاب المدرسة: قراءة وكلمات، أناشيد، أساليب وقواعد</p>
    <div class="name-row">
      <label for="nameInput">ما اسمك؟</label>
      <input id="nameInput" type="text" maxlength="20" placeholder="اكتب اسمك هنا" autocomplete="off">
    </div>
    <button class="game-card" id="goGame">🎮 لعبة هذا وهذه وهؤلاء</button>
    <div id="g2Units" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>

  <!-- LESSON -->
  <section id="scrLesson" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="l-head"><div class="l-icon" id="lIcon"></div><div class="l-title" id="lTitle"></div></div>
    <div class="steps" id="lSteps"></div>
    <div class="l-body" id="lBody"></div>
  </section>

  <!-- START -->
  <section id="scrStart" class="panel" style="display:flex;flex-direction:column;gap:18px">
    <h1><span class="w1">هذا</span> و<span class="w2">هذه</span> و<span class="w3">هؤلاء</span></h1>
    <p class="sub">لعبة أسماء الإشارة للصف الثاني</p>
    <div class="rules">
      <div class="rule c-boy"><b>هذا</b><span>للمفرد المذكر</span><span class="em">👦 ✏️</span></div>
      <div class="rule c-girl"><b>هذه</b><span>للمفرد المؤنث وجمع غير العاقل</span><span class="em">👧 📚</span></div>

    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cols = ["#2F80ED", "#E8508A", "#2BA84A", "#FFC93C", "#9B51E0"];
    for (let i = 0; i < n; i++) bits.push({
      x: cv.width / 2 + (Math.random() - .5) * cv.width * .3, y: cv.height * .45,
      vx: (Math.random() - .5) * 26, vy: -Math.random() * 26 - 8, r: Math.random() * 6 + 5,

    const st = stepsOf(lesson), i = st.indexOf(lstep);
    if (i < st.length - 1) goStep(st[i + 1]); else lessonDone();
  }
  function stepCleared(text = GS.stepDone) {
    markDone(lesson, lstep); renderSteps();
    lbody().innerHTML = `<div class="cleared"><div class="big-em">🌟</div><p>${text}</p></div>`;
    talk(withName(text), text);
    nextButton();
  }
  function lessonDone() {
    renderSteps(); confetti(160); setTimeout(() => confetti(100), 500); fanfare();
    lbody().innerHTML = `<div class="cleared"><div class="big-em">🏆</div><p>${GS.allDone}</p></div>`;
    talk(withName(GS.allDone), GS.allDone);
    const i = LESSONS.indexOf(lesson);
    if (i < LESSONS.length - 1) button("الدرس التالي ⬅", "go", () => openLesson(LESSONS[i + 1]));
    button("📚 المنهج", "", showCourse);
  }

  // ---------- question engine ----------
  // q = { text, say, show(box, resolve) }; resolve(ok, btn, afterParts)
  function runQuiz(qs, onEnd) {
    let i = 0;
    const next = () => {
      if (i >= qs.length) return onEnd();
      const q = qs[i];
      lbody().innerHTML = `<div class="qdots">${qs.map((_, j) => `<span class="${j < i ? "on" : j === i ? "now" : ""}"></span>`).join("")}</div><div class="q" id="qBox"></div>`;
      let first = true, over = false;
      const resolve = (ok, btn, after) => {
        if (over) return;
        if (ok) {
          over = true;
          if (btn) btn.classList.add("right");
          lbody().querySelectorAll(".q button").forEach(b => { if (b !== btn && !b.classList.contains("hear")) b.disabled = true; });
          if (q.onRight) q.onRight();
          ding(); confetti(first ? 45 : 15);
          const pr = pick(PRAISE);
          talk(withName(pr), [pr, ...(after || [])]);
          i++; setTimeout(next, 1600 + (after ? after.length * 1300 : 0));
        } else {
          first = false; boop();
          if (btn) { btn.classList.remove("no"); void btn.offsetWidth; btn.classList.add("no"); btn.disabled = true; }
          talk(GS.tryAgain);
        }
      };
      q.show($("qBox"), resolve);
      talk(q.text, q.say || q.text);
    };
    next();
  }
  const hearBtn = parts => { const b = document.createElement("button"); b.className = "hear"; b.textContent = "🔊 اسمع"; b.onclick = () => say(parts); return b; };
  function qChoice({ text, say: parts, emo, html, hear, opts, cls = "", onRight }) {
    return { text, say: parts, onRight, show(box, resolve) {
      const h = document.createElement("div"); h.className = "q-head";
      if (emo) h.insertAdjacentHTML("beforeend", `<div class="q-pic">${emo}</div>`);
      if (html) h.insertAdjacentHTML("beforeend", html);
      if (hear) h.appendChild(hearBtn(hear));
      box.appendChild(h);
      const o = document.createElement("div"); o.className = "q-opts " + cls; box.appendChild(o);
      opts.forEach(op => {
        const b = document.createElement("button");
        b.className = "opt"; b.innerHTML = op.html;
        b.onclick = () => resolve(op.ok, b, op.ok ? op.after : null);
        o.appendChild(b);
      });
    } };
  }
  function qMulti({ text, say: parts, items, cls = "many" }) {
    return { text, say: parts, show(box, resolve) {
      const o = document.createElement("div"); o.className = "q-opts " + cls; box.appendChild(o);
      let left = items.filter(x => x.ok).length;
      items.forEach(it => {
        const b = document.createElement("button"); b.className = "opt"; b.innerHTML = it.html;
        b.onclick = () => {
          if (!it.ok) return resolve(false, b);
          b.disabled = true; b.classList.add("picked"); say(it.v);
          if (--left === 0) resolve(true, null); else tone([880], .06);
        };
        o.appendChild(b);
      });
    } };
  }
  const opts = (right, wrong, after) => shuffle([right, ...wrong]).map(x => ({ html: x, ok: x === right, after }));
  const sentence = (t, fill) => t.replace("___", fill === undefined ? '<span class="gap">؟</span>' : `<b class="filled">${fill}</b>`);

  // ---------- question makers (one per exercise type in the book) ----------
  const ALLV = LESSONS.filter(l => l.kind === "vocab");
  const pool = key => ALLV.flatMap(l => l[key] || []);
  function vocabQs(L, n = 7) {
    const qs = [];
    const add = (key, text, pairs, flip) => sample(pairs, 2).forEach(([a, b]) => {
      const [w, right] = flip ? [b, a] : [a, b];
      const wrong = sample([...new Set(pool(key).map(p => flip ? p[0] : p[1]).filter(x => x !== right && x !== w))], 2);
      qs.push(qChoice({ text, say: [text, w], html: `<div class="q-word">${w}</div>`, hear: [w], opts: opts(right, wrong, [w, right]) }));
    });
    add("syn", GS.syn, L.syn); add("opp", GS.opp, L.opp); add("plural", GS.plural, L.plural);
    const [s, p] = pick(L.plural);
    const wrong = sample(pool("plural").map(x => x[0]).filter(x => x !== s), 2);
    qs.push(qChoice({ text: GS.single, say: [GS.single, p], html: `<div class="q-word">${p}</div>`, hear: [p], opts: opts(s, wrong, [p, s]) }));
    return sample(qs, n);
  }
  const fillQs = (L, n) => sample(L.qs, n).map(([t, emo, right, wrong]) =>
    qChoice({ text: L.ask, say: [L.ask], emo, html: `<div class="q-sent">${sentence(t)}</div>`, opts: opts(right, wrong, [t.replace("___", right)]) }));
  const kindQs = (L, n) => sample(L.kinds, n).map(([t, k]) => {
    const labels = L.id === "place" ? [["زمان", GS.zaman], ["مكان", GS.makan]] : [["أمر", GS.amr], ["نهي", GS.nahy]];
    return qChoice({ text: L.kindAsk, say: [L.kindAsk, t], html: `<div class="q-sent">${t}</div>`, hear: [t], cls: "two",
      opts: labels.map(([key, lbl]) => ({ html: lbl, ok: key === k, after: [lbl] })) });
  });
  const pickQs = (L, n) => sample(L.picks, n).map(([t, right]) =>
    qChoice({ text: L.pick, say: [L.pick, t], html: `<div class="q-sent">${t}</div>`, hear: [t], cls: "many",
      opts: t.replace(/[.،]/g, "").split(" ").map(w => ({ html: w, ok: w === right, after: [t] })) }));
  const SPECIAL = {
    dual: n => [
      ...sample(G2.dual, Math.ceil(n / 2)).map(([s, d, p, emo]) => qChoice({ text: GS.dualQ, say: [GS.dualQ, s], emo: emo + emo,
        html: `<div class="q-word">${s} + ${s}</div>`, opts: opts(d, [p, s], [d]) })),
      ...sample(G2.dualWords, Math.floor(n / 2)).map(([w, k]) => qChoice({ text: GS.dualKind, say: [GS.dualKind, w], html: `<div class="q-word">${w}</div>`,
        hear: [w], cls: "two", opts: [["مفرد", GS.mufrad], ["مثنى", GS.muthanna]].map(([key, lbl]) => ({ html: lbl, ok: key === k, after: [w] })) })),
    ],
    syll: n => sample(G2.syll, n).map(([w, split, emo], i) => {
      const parts = split.split(" / ");
      if (i % 2) {
        const c = parts.length;
        return qChoice({ text: GS.syllCount, say: [GS.syllCount, w], emo, html: `<div class="q-word">${w}</div>`, hear: [w],
          opts: opts(ar(c), [ar(c - 1), ar(c + 1)], [w]) });
      }
      const merged = k => parts.slice(0, k).concat(parts[k] + parts[k + 1], parts.slice(k + 2)).join(" / ").replace(/ـ/g, "");
      const wrong = [...new Set([merged(0), merged(parts.length - 2), merged(Math.floor((parts.length - 1) / 2))])].filter(x => x !== split).slice(0, 2);
      return qChoice({ text: GS.syllQ, say: [GS.syllQ, w], emo, html: `<div class="q-word">${w}</div>`, hear: [w], cls: "one", opts: opts(split, wrong, [w]) });
    }),
    lam: n => [
      ...sample(LESSONS.find(l => l.id === "lam").words, n - 1).map(([w, emo, k]) => qChoice({ text: GS.lamQ, say: [GS.lamQ, w], emo,
        html: `<div class="q-word">${w}</div>`, hear: [w], cls: "two",
        opts: [["s", "☀️ " + GS.sun], ["q", "🌙 " + GS.moon]].map(([key, lbl]) => ({ html: lbl, ok: key === k, after: [w] })) })),
      (() => { const ws = sample(LESSONS.find(l => l.id === "lam").words, 6);
        return qMulti({ text: GS.lamPick, say: [GS.lamPick], items: ws.map(([w, emo, k]) => ({ html: `${emo}<br>${w}`, v: w, ok: k === "s" })) }); })(),
    ],
    sim: n => sample(LESSONS.find(l => l.id === "sim").words, n).map(([w, emo, right, others]) => {
      const rest = w.replace(/^.[ً-ْ]*/, "");
      return qChoice({ text: GS.simQ, say: [GS.simQ, w], emo, hear: [w],
        html: `<div class="q-word"><span class="tile-l blank">؟</span>${rest}</div>`, opts: opts(right, others.split(" "), [w]) });
    }),
  };
  function grammarQs(L) {
    if (L.quiz) return SPECIAL[L.quiz](L.quiz === "lam" ? 7 : 6);
    return [...fillQs(L, 5), ...(L.picks ? pickQs(L, 2) : []), ...(L.kinds ? kindQs(L, 3) : [])];
  }

  // ---------- steps ----------
  const STEPS = {
    poem(L) {
      lbody().innerHTML = `<div class="poem"></div>`;
      const box = lbody().querySelector(".poem");
      L.poem.forEach(line => { const b = document.createElement("button"); b.className = "poem-line"; b.textContent = line; b.onclick = () => say(line); box.appendChild(b); });
      button("▶️ اسمع النشيد كله", "primary", () => say(L.poem));
      talk(GS.poem);
      nextButton();
    },
    words(L) {
      lbody().innerHTML = "";
      [["syn", "الكلمة ومرادفها", "="], ["opp", "الكلمة ومضادها", "≠"], ["plural", "المفرد والجمع", "⬅"]].forEach(([key, title, sign]) => {
        if (!L[key]) return;
        lbody().insertAdjacentHTML("beforeend", `<h3 class="vt">${title}</h3><div class="vlist" id="v-${key}"></div>`);
        L[key].forEach(([a, b]) => {
          const r = document.createElement("button"); r.className = "vrow";
          r.innerHTML = `<span>${a}</span><i>${sign}</i><span>${b}</span>`;
          r.onclick = () => say([a, b]);
          $("v-" + key).appendChild(r);
        });
      });
      talk(GS.words);
      nextButton();
    },
    learn(L) {
      lbody().innerHTML = `<div class="rule-box"></div><div class="examples"></div>`;
      L.rule.forEach(r => { const b = document.createElement("button"); b.className = "rule-line"; b.textContent = r; b.onclick = () => say(r); lbody().querySelector(".rule-box").appendChild(b); });
      L.examples.forEach(([t, emo]) => { const b = document.createElement("button"); b.className = "ex-card"; b.innerHTML = `<span class="em">${emo}</span><span>${t}</span>`; b.onclick = () => say(t); lbody().querySelector(".examples").appendChild(b); });
      if (L.game) button("🎮 العب لعبة هذا وهذه وهؤلاء", "primary", () => { say(GS.playGame); show("scrStart"); });
      talk(GS.learn);
      nextButton();
    },
    quiz(L) {
      if (L.kind === "vocab") return runQuiz(vocabQs(L), () => stepCleared());
      if (L.kind === "review") {
        talk(GS.reviewIntro);
        const qs = [...sample(ALLV, 3).flatMap(v => vocabQs(v, 1)),
          ...sample(LESSONS.filter(l => l.kind === "grammar"), 5).flatMap(g => sample(grammarQs(g), 1))];
        return runQuiz(shuffle(qs), () => stepCleared(GS.allDone));
      }
      runQuiz(grammarQs(L), () => stepCleared());
    },
  };

  showCourse();
})();
</script>
